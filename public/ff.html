<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a2e">
<title>Fastest Finger</title>
<link rel="icon" type="image/png" sizes="64x64" href="/static/brand/favicon-64.png">
<link rel="apple-touch-icon" href="/static/brand/favicon-180.png">
<style>
    :root { --blue: #3d8fe0; --blue-2: #7cc6ff; --gold: #f4c518; --orange: #f39a4c; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: manipulation;
        background:
            radial-gradient(ellipse at 50% 55%, rgba(120, 160, 255, .55) 0%, rgba(80, 60, 190, .35) 30%, transparent 62%),
            repeating-conic-gradient(from 12deg at 50% 60%, rgba(140, 170, 255, .10) 0 3deg, transparent 3deg 17deg),
            linear-gradient(180deg, #0b0a2e 0%, #231a6b 48%, #0d0b35 100%);
        display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }

    header { text-align: center; padding: 10px 12px 4px; font-size: clamp(15px, 2.4vh, 22px); position: relative; min-height: 34px; }
    header .who { cursor: pointer; }
    header .seat { position: absolute; left: 12px; top: 10px; font-size: 13px; opacity: .75; }
    header .tools { position: absolute; right: 10px; top: 6px; display: flex; gap: 6px; }
    header .tools button { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .25); color: #fff; border-radius: 8px; padding: 4px 8px; font-size: 14px; cursor: pointer; }
    .net { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #e33; margin-right: 6px; vertical-align: middle; }
    .net.on { background: #3c3; }

    /* The strap: black hexagon with a blue border and orange diamonds (status / the order being composed) */
    .strapRow { position: relative; display: flex; align-items: center; justify-content: center; padding: 6px 0 4px; }
    .strapRow::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; background: var(--blue); transform: translateY(-50%); }
    .strap { position: relative; width: min(820px, 64vw); min-height: 76px; display: flex; align-items: center; justify-content: center; gap: 12px;
        clip-path: polygon(0 50%, 34px 0, calc(100% - 34px) 0, 100% 50%, calc(100% - 34px) 100%, 34px 100%); background: var(--blue); padding: 4px; }
    .strap .inner { position: absolute; inset: 4px; clip-path: polygon(0 50%, 31px 0, calc(100% - 31px) 0, 100% 50%, calc(100% - 31px) 100%, 31px 100%); background: #000; }
    .strap .text { position: relative; z-index: 1; font-size: 18px; text-align: center; line-height: 1.3; padding: 8px 64px; text-transform: uppercase; letter-spacing: .5px; }
    .strap .text b { font-size: 26px; letter-spacing: 6px; }
    .strap .diamond { position: absolute; z-index: 1; top: 50%; width: 12px; height: 12px; background: var(--orange); transform: translateY(-50%) rotate(45deg); }
    .strap .diamond.l { left: 34px; } .strap .diamond.r { right: 34px; }
    .ok { display: inline-block; background: #19a64a; color: #fff; font-weight: 800; border-radius: 6px; padding: 2px 10px; margin-left: 10px; letter-spacing: 1px; }
    .timebar { height: 5px; width: min(820px, 64vw); margin: 4px auto 0; background: rgba(255, 255, 255, .15); border-radius: 3px; overflow: hidden; visibility: hidden; }
    .timebar div { height: 100%; width: 100%; background: linear-gradient(90deg, #19a64a, #f4c518, #e33); transform-origin: left; }

    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 0; padding: 0 16px; }
    .question { font-size: clamp(22px, 5.2vh, 52px); text-align: center; line-height: 1.2; max-width: 1100px; max-height: 32vh; overflow: hidden; }
    .question.dim { font-size: clamp(18px, 3vh, 30px); opacity: .8; }

    /* The four items: gold letter badges over black lozenges */
    .items { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 10px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
    .badge { width: clamp(64px, 9vw, 110px); height: clamp(38px, 5.4vh, 64px); border-radius: 50%; background: #000; border: 4px solid var(--blue);
        display: flex; align-items: center; justify-content: center; color: var(--gold); font: 900 clamp(22px, 3.6vh, 40px) Georgia, "Times New Roman", serif; text-shadow: 0 0 2px #8a6a00; }
    .lozenge { width: 100%; height: clamp(90px, 20vh, 210px); position: relative; background: linear-gradient(180deg, #1c5bd6, var(--blue-2), #1c5bd6);
        clip-path: polygon(0 50%, 16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%); transition: filter .15s; }
    .lozenge .face { position: absolute; inset: 5px; background: #000; clip-path: polygon(0 50%, 13px 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 13px 100%);
        display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px 22px; font-size: clamp(16px, 3.6vh, 42px); line-height: 1.15; overflow: hidden; }
    .item.picked .lozenge { filter: grayscale(.6) brightness(.55); }
    .item .pos { position: absolute; top: calc(clamp(38px, 5.4vh, 64px) + 10px); right: 8px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; background: var(--orange);
        color: #000; font-weight: 900; font-size: 22px; display: none; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #000; }
    .item.picked .pos { display: flex; }
    .item.correct .lozenge { background: #19a64a; }

    /* Keypad: red backspace, A B C D, green confirm */
    .keys { display: grid; grid-template-columns: 1fr repeat(4, 1.3fr) 1fr; gap: 10px; padding: 12px 12px 14px; }
    .keys button { height: clamp(64px, 11vh, 120px); border-radius: 18px; border: 0; font: 900 clamp(26px, 5vh, 52px) Georgia, "Times New Roman", serif; cursor: pointer;
        box-shadow: 0 6px 0 rgba(0, 0, 0, .45), inset 0 2px 0 rgba(255, 255, 255, .25); transition: transform .06s, box-shadow .06s, filter .15s; touch-action: manipulation; }
    .keys button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .45); }
    .keys button:disabled { filter: grayscale(1) brightness(.5); cursor: default; }
    .keys .letter { background: linear-gradient(180deg, #1e2a8a, #0a1150); color: var(--gold); border: 3px solid var(--blue); }
    .keys .del { background: linear-gradient(180deg, #ff4d4d, #b40f0f); color: #fff; font-family: "Segoe UI", Arial, sans-serif; }
    .keys .go { background: linear-gradient(180deg, #3ddc6b, #0f8a36); color: #fff; font-family: "Segoe UI", Arial, sans-serif; }

    /* Name form */
    #nameForm { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 20, .82); display: flex; align-items: center; justify-content: center; }
    #nameForm[hidden] { display: none; }
    #nameForm form { background: #0b1740; border: 2px solid var(--blue-2); border-radius: 18px; padding: 26px 30px; width: min(520px, 92vw); display: flex; flex-direction: column; gap: 12px; font-size: 18px; }
    #nameForm h2 { margin: 0; }
    #nameForm label { display: flex; flex-direction: column; gap: 6px; }
    #nameForm input { font-size: 22px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--blue-2); background: #04102f; color: #fff; }
    #nameForm .row { display: flex; gap: 10px; justify-content: flex-end; }
    #nameForm button { font-size: 18px; font-weight: 700; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--blue-2); background: #16245a; color: #fff; cursor: pointer; }
    #nameForm button.primary { background: var(--orange); border-color: var(--orange); color: #000; }
    #nameForm .msg { color: var(--orange); min-height: 22px; }

    @media (orientation: portrait) {
        .items { grid-template-columns: repeat(2, 1fr); row-gap: 10px; }
        .lozenge { height: clamp(70px, 12vh, 150px); }
        .keys { grid-template-columns: repeat(4, 1fr); }
        .keys .del { grid-column: 1 / 3; grid-row: 2; }
        .keys .go { grid-column: 3 / 5; grid-row: 2; }
        .strap { width: 92vw; } .timebar { width: 92vw; }
    }
</style>
<style id="mc-layout"></style>
</head>
<body data-edit="background" data-edit-label="Background">
    <header>
        <span class="seat" data-edit="seat" data-edit-label="Seat and connection"><span class="net" id="net"></span><span id="seatLabel">Seat -</span></span>
        <span class="who" id="who" title="Change your name" data-edit="player-name" data-edit-label="Player name and hometown">Name - Hometown</span>
        <span class="tools"><button id="fullscreen" title="Full screen">&#x26F6;</button></span>
    </header>

    <div class="strapRow">
        <div class="strap" data-edit="strap" data-edit-label="Strap (border)"><div class="inner" data-edit="strap-inside" data-edit-label="Strap (inside)"></div><span class="diamond l"></span><span class="text" id="strap" data-edit="strap-text" data-edit-label="Strap text">Connecting...</span><span class="diamond r"></span></div>
    </div>
    <div class="timebar" id="timebar" data-edit="time-bar" data-edit-label="Time bar"><div></div></div>

    <main><div class="question" id="question" data-edit="question" data-edit-label="Question"></div></main>

    <div class="items" id="items" data-edit="items" data-edit-label="Items row"></div>

    <div class="keys" data-edit="keypad" data-edit-label="Keypad">
        <button class="del" id="del" disabled aria-label="Delete" data-edit="key-delete" data-edit-label="Key: delete (red)">&#9003;</button>
        <button class="letter" data-edit="key-letter" data-edit-label="Keys: A B C D" data-l="A" disabled>A</button>
        <button class="letter" data-edit="key-letter" data-edit-label="Keys: A B C D" data-l="B" disabled>B</button>
        <button class="letter" data-edit="key-letter" data-edit-label="Keys: A B C D" data-l="C" disabled>C</button>
        <button class="letter" data-edit="key-letter" data-edit-label="Keys: A B C D" data-l="D" disabled>D</button>
        <button class="go" id="go" disabled aria-label="Confirm" data-edit="key-confirm" data-edit-label="Key: confirm (green)">&#10004;</button>
    </div>

    <div id="nameForm" hidden>
        <form autocomplete="off">
            <h2>Who's playing?</h2>
            <label>Name or alias <input name="first" maxlength="60" required></label>
            <label>Surname (optional) <input name="last" maxlength="60"></label>
            <label>From <input name="location" maxlength="80" placeholder="e.g. Milano"></label>
            <div class="msg"></div>
            <div class="row"><button type="button" data-close>Cancel</button><button type="submit" class="primary">Save</button></div>
        </form>
    </div>

<script src="/socket.io/socket.io.js"></script>
<script src="/static/ff.js"></script>
</body>
</html>
